<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="A cat curled asleep inside the dark folds of a sweater">
  <defs>
    <radialGradient id="dark" cx="50%" cy="55%" r="65%"><stop offset="0" stop-color="#2B2130"/><stop offset="1" stop-color="#07080C"/></radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#D9904F" stop-opacity=".35"/><stop offset="1" stop-color="#D9904F" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#dark)"/>
  <!-- sweater folds -->
  <g fill="none" stroke="#4A3B4F" stroke-width="18" stroke-linecap="round" opacity=".8">
    <path d="M-20 120 C 90 60, 160 180, 300 90 S 430 140, 440 60"/>
    <path d="M-30 420 C 80 480, 180 360, 300 440 S 420 400, 450 470"/>
    <path d="M30 -10 C 10 120, 60 220, 20 330"/>
    <path d="M380 20 C 400 160, 340 250, 390 420"/>
  </g>
  <g fill="none" stroke="#5E4A62" stroke-width="2" opacity=".5">
    <path d="M-20 140 C 90 80, 160 200, 300 110 S 430 160, 440 80"/>
    <path d="M-30 400 C 80 460, 180 340, 300 420 S 420 380, 450 450"/>
  </g>
  <circle cx="200" cy="265" r="150" fill="url(#warm)"/>
  <!-- cat, curled -->
  <g transform="translate(200 270)">
    <ellipse rx="96" ry="72" fill="#151017"/>
    <path d="M-96 10 C -110 60, -40 90, 10 70 C 60 50, 20 30, -10 40 C -40 50, -60 30, -70 10" fill="none" stroke="#151017" stroke-width="22" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="48" cy="-18" r="40" fill="#151017"/>
    <path d="M20 -48 l-6 -30 l26 16z" fill="#151017"/><path d="M76 -48 l6 -30 l-26 16z" fill="#151017"/>
    <path d="M22 -46 l-3 -20 l17 11z" fill="#3A2A3D"/><path d="M74 -46 l3 -20 l-17 11z" fill="#3A2A3D"/>
    <!-- closed eyes -->
    <path d="M30 -14 q8 6 16 0" fill="none" stroke="#D9904F" stroke-width="2" stroke-linecap="round"/>
    <path d="M58 -14 q8 6 16 0" fill="none" stroke="#D9904F" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 -4 l3 4 l-6 0z" fill="#D9904F" opacity=".8"/>
    <!-- fur highlights -->
    <path d="M-70 -30 q40 -30 90 -20" fill="none" stroke="#2A2030" stroke-width="3" stroke-linecap="round"/>
    <path d="M-80 0 q30 -20 70 -22" fill="none" stroke="#2A2030" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
