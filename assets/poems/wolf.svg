  <rect width="400" height="500" fill="url(#sky)"/>
  <circle cx="270" cy="120" r="78" fill="#E8DCC2"/>
  <circle cx="250" cy="100" r="12" fill="#D9CBB0" opacity=".6"/><circle cx="292" cy="140" r="18" fill="#D9CBB0" opacity=".5"/><circle cx="285" cy="95" r="7" fill="#D9CBB0" opacity=".5"/>
